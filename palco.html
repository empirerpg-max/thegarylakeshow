<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palco — The Gary Lake Show</title>
  <link rel="stylesheet" href="css/tema.css" />
  <link rel="stylesheet" href="css/palco.css" />
</head>
<body class="palco">
  <!--
    REGRA CRÍTICA: nenhuma resposta, dica, gabarito ou foto de revelação pode
    existir neste HTML antes da hora. Este arquivo só mostra a tela vazia
    (logo estático). Todo conteúdo de quadro é injetado em tempo real via
    js/sync.js, a partir do que o controle.html manda — nunca escrito aqui.
  -->
  <div id="quadro-atual">
    <div class="palco-vazio">
      <div class="logo">THE GARY <span class="rosa">LAKE</span> <span class="azul">SHOW</span></div>
    </div>
  </div>

  <style>
    .grade-lojas-palco {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      width: 90%;
      max-width: 900px;
    }
    .loja-botao-palco {
      background: var(--fundo-elevado);
      border: 3px solid var(--azul);
      border-radius: 8px;
      padding: 2rem 1rem;
      text-align: center;
      cursor: pointer;
      color: var(--texto);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }
    .loja-botao-palco img {
      max-width: 100%;
      max-height: 140px;
      border-radius: 4px;
      object-fit: contain;
    }
    .loja-botao-palco:hover,
    .loja-botao-palco:focus {
      border-color: var(--rosa);
    }
    .loja-botao-palco.escolhida {
      border-color: var(--amarelo);
      background: #2a2a30;
    }
    .foto-revelacao {
      max-width: 70vw;
      max-height: 60vh;
      border-radius: 8px;
    }
    .explosao {
      color: var(--fogo-vermelho);
      font-family: var(--fonte-titulo);
      text-transform: uppercase;
      font-size: 2em;
      text-shadow: 0 0 20px var(--fogo-laranja);
    }
    .salvou-texto {
      color: var(--azul);
      font-family: var(--fonte-titulo);
      text-transform: uppercase;
      font-size: 2em;
    }
  </style>
  <script type="module">
    import { aoReceber, enviar } from './js/sync.js';

    const quadroAtual = document.getElementById('quadro-atual');
    const logoPalco = quadroAtual.innerHTML;

    function mostrarLogo() {
      quadroAtual.innerHTML = logoPalco;
    }

    function mostrarCapaArquivoGary(convidado) {
      quadroAtual.innerHTML = `
        <div style="text-align:center;">
          <div style="font-family: var(--fonte-titulo); text-transform: uppercase; letter-spacing: 0.1em; color: var(--amarelo); font-size: 1.2em;">
            Arquivo confidencial
          </div>
          <div style="font-family: var(--fonte-titulo); text-transform: uppercase; color: var(--texto); font-size: 1.8em; margin-top: 0.3em;">
            ${convidado}
          </div>
        </div>
      `;
    }

    // Só o título da peça, sem o dado — aparece "sem aviso prévio" quando
    // Gary clica "puxar do arquivo" no controle.
    function mostrarTituloPeca(peca) {
      quadroAtual.innerHTML = `
        <div style="text-align:center;">
          <div style="font-family: var(--fonte-titulo); text-transform: uppercase; letter-spacing: 0.05em; color: var(--azul); font-size: 1.6em;">
            ${peca.titulo}
          </div>
        </div>
      `;
      // Depois de um instante, o dado surge grande — clique único do lado do
      // controle já dispara isso, não precisa de segundo clique.
      setTimeout(() => mostrarDadoPeca(peca), 1200);
    }

    function mostrarDadoPeca(peca) {
      quadroAtual.innerHTML = `
        <div style="text-align:center;">
          <div style="font-family: var(--fonte-titulo); text-transform: uppercase; letter-spacing: 0.05em; color: var(--azul); font-size: 1.1em;">
            ${peca.titulo}
          </div>
          <div style="font-family: var(--fonte-titulo); color: var(--rosa); font-size: 1.7em; margin-top: 0.4em;">
            ${peca.dadoPrincipal}
          </div>
          <div style="color: var(--texto); font-size: 0.7em; margin-top: 0.6em; opacity: 0.85;">
            ${peca.contextoSecundario || ''}
          </div>
        </div>
      `;
    }

    // --- Shopping: o convidado interage direto aqui no palco ---

    function mostrarLojasShopping(lojas) {
      // Cada loja é { nome, foto }. "foto" vem da coluna "Foto loja" da
      // planilha do programa — se Gary não preencheu ainda, mostra só o
      // nome (nunca quebra por falta de imagem).
      const botoes = lojas
        .map(({ nome, foto }) => {
          const imagem = foto ? `<img src="${foto}" alt="${nome}" />` : '';
          return `<button class="loja-botao-palco" data-loja="${nome}">${imagem}<span>${nome}</span></button>`;
        })
        .join('');
      quadroAtual.innerHTML = `<div class="grade-lojas-palco">${botoes}</div>`;
      quadroAtual.querySelectorAll('.loja-botao-palco').forEach((botao) => {
        botao.addEventListener('click', () => {
          quadroAtual.querySelectorAll('.loja-botao-palco').forEach((b) => b.classList.remove('escolhida'));
          botao.classList.add('escolhida');
          // Avisa o controle qual loja o convidado escolheu — via de mão
          // dupla: o palco também manda mensagem, não só recebe.
          enviar('shopping:loja-escolhida', { loja: botao.dataset.loja });
        });
      });
    }

    function revelarFotoShopping({ loja, artista, foto }) {
      quadroAtual.innerHTML = `
        <div style="text-align:center;">
          <div style="font-family: var(--fonte-titulo); text-transform: uppercase; color: var(--amarelo); font-size: 1.1em; margin-bottom: 0.5em;">
            ${loja}
          </div>
          ${foto ? `<img class="foto-revelacao" src="${foto}" alt="${artista}" />` : ''}
          <div style="font-family: var(--fonte-titulo); text-transform: uppercase; color: var(--rosa); font-size: 1.8em; margin-top: 0.5em;">
            ${artista}
          </div>
        </div>
      `;
    }

    function mostrarResultadoShopping(resultado) {
      const conteudo =
        resultado === 'explodiu'
          ? '<div class="explosao">💥 EXPLODIU 💥</div>'
          : '<div class="salvou-texto">SALVOU</div>';
      quadroAtual.innerHTML = `<div style="text-align:center;">${conteudo}</div>`;
    }

    aoReceber((mensagem) => {
      console.log('palco recebeu:', mensagem);
      if (mensagem.comando === 'mostrar-quadro' && !mensagem.dados?.quadro) {
        mostrarLogo();
      } else if (mensagem.comando === 'arquivo-gary:capa') {
        mostrarCapaArquivoGary(mensagem.dados.convidado);
      } else if (mensagem.comando === 'arquivo-gary:revelar-peca') {
        mostrarTituloPeca(mensagem.dados.peca);
      } else if (mensagem.comando === 'shopping:mostrar-lojas') {
        mostrarLojasShopping(mensagem.dados.lojas);
      } else if (mensagem.comando === 'shopping:revelar-foto') {
        revelarFotoShopping(mensagem.dados);
      } else if (mensagem.comando === 'shopping:resultado') {
        mostrarResultadoShopping(mensagem.dados.resultado);
      }
    });
  </script>
</body>
</html>
